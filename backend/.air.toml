root = "."
tmp_dir = "tmp"

[build]
  # Thư mục chứa file main.go
  cmd = "go build -o ./tmp/main.exe ./cmd/api/main.go"
  # File thực thi sau khi build
  bin = "tmp\\main.exe"
  # Tùy chỉnh các đuôi file cần theo dõi
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  # Bỏ qua các thư mục không cần thiết
  exclude_dir = ["assets", "tmp", "vendor", "frontend"]
  # Trễ 1000ms trước khi build lại để tránh build liên tục khi save nhiều file
  delay = 1000
  # Dừng build nếu có lỗi
  stop_on_error = true
  log = "air.log"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Xóa thư mục tmp khi thoát
  clean_on_exit = true
